<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Conflict Network Navigator · The War Maps Project</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.78.4/dist/3d-force-graph.min.js" defer></script>
  <script src="data.js?v=2026-09-09-r1" defer></script>
  <script src="network-3d.js?v=2026-09-12-r2" defer></script>
  <style>
    :root{color-scheme:dark;background:#05080a;color:#e8dfbd;font:14px/1.4 Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body,#navigator{width:100%;height:100%;margin:0;overflow:hidden}#navigator{background:radial-gradient(circle at 50% 42%,#172329,#05080a 76%)}.navigator-hud{position:fixed;z-index:2;inset:18px 20px auto;display:flex;align-items:start;justify-content:space-between;pointer-events:none}.navigator-card{max-width:min(520px,60vw);padding:13px 16px;border:1px solid #565844;background:#0b1110d9;box-shadow:0 12px 35px #0008;backdrop-filter:blur(9px);pointer-events:auto}.navigator-card h1{margin:0 0 4px;font:700 1.35rem/1.1 Georgia,serif;color:#f0e6c0}.navigator-card p{margin:0;color:#b9b59d;font-size:.75rem}.navigator-actions{display:flex;gap:8px;pointer-events:auto}.navigator-actions button{height:38px;padding:0 12px;border:1px solid #f07800;background:#101713;color:#f5edce;font-weight:800;cursor:pointer}.navigator-actions button:hover{background:#f07800;color:#070907}.navigator-hint{position:fixed;z-index:2;left:20px;bottom:20px;padding:9px 12px;border:1px solid #565844;background:#0b1110c7;color:#b9b59d;font-size:.72rem;pointer-events:none}.navigator-loading{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);color:#b9b59d}
  </style>
</head>
<body>
  <div id="navigator"><p class="navigator-loading">Loading lit 3D conflict network…</p></div>
  <div class="navigator-hud"><div class="navigator-card"><h1 id="navigator-title">3D conflict network navigator</h1><p>Lit Three.js view · nations are tetrahedrons · drag nodes to reposition them</p></div><div class="navigator-actions"><button id="navigator-fit" type="button">Fit network</button><button id="navigator-close" type="button">Close navigator</button></div></div>
  <div class="navigator-hint">Drag empty space to orbit · two-finger/right drag to pan · scroll to zoom · drag a node to move it</div>
</body>
</html>
